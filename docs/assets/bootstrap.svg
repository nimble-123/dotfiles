<title id="bootstrap-title">Bootstrapping a new Mac</title>
<desc id="bootstrap-desc">Flowchart of the one-liner: it installs Xcode tools and Homebrew, runs chezmoi init, shows a diff and only after confirmation runs brew bundle, writes the dotfiles, applies macOS defaults and sets up the Dock.</desc>
